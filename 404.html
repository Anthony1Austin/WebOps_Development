<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found | WebOps Development LLC</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=20250628">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-4xl) var(--spacing-md);
        }
        .error-page__inner {
            max-width: 560px;
            text-align: left;
        }
        .error-page__code {
            font-family: var(--font-family-heading);
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: var(--font-weight-bold);
            color: var(--color-primary);
            line-height: 1;
            margin-bottom: var(--spacing-lg);
        }
        .error-page__title {
            font-size: var(--font-size-3xl);
            margin-bottom: var(--spacing-md);
        }
        .error-page__text {
            font-size: var(--font-size-lg);
            color: var(--color-gray-600);
            margin-bottom: var(--spacing-2xl);
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-page__inner">
            <p class="error-page__code">404</p>
            <h1 class="error-page__title">This page doesn't exist.</h1>
            <p class="error-page__text">
                Maybe the URL is wrong, maybe we moved something, maybe the link is just old.
                Either way — you're not lost forever.
            </p>
            <a href="/" class="btn btn--primary btn--large">Back to the homepage</a>
        </div>
    </main>
</body>
</html>
